name: saas_identity_platform_flutter
description: SaaS 多租户多应用身份平台的 Flutter 客户端（Android + Web）。
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  dio: 6.0.0
  # 生成客户端（lib/generated/）的传递依赖（json_annotation 等）由 gen-shared 产物
  # 对账后补（Phase 0a Task 8），以生成器临时包 pubspec 的约束为准钉 exact。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
